name: Calidad

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://eventos.example.test
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only_000000000000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-validation.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version: 22
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
